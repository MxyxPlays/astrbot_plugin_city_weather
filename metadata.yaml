name: astrbot_plugin_city_weather
display_name: 城市天气
short_desc: 全国城市天气，说一声就能查实况和预报
desc: 全国城市天气查询：直接说「上海天气」「北京天气预报」就能查实况和预报（高德天气 API），省/市/区县都能查
help: 直接说「城市名+天气」，全国城市和区县都行，例如：上海天气怎么样 / 北京天气预报 / 温州瑞安天气；也可以发「天气 上海」
version: v1.0.0
author: 小南
repo: https://github.com/MxyxPlays/astrbot_plugin_city_weather

